<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none">
  <!-- Movie reel & number 0 stylized mark -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>
  <g transform="translate(10, 10)">
    <!-- Stylized camera / film lens frame -->
    <rect x="2" y="2" width="36" height="36" rx="10" stroke="url(#goldGrad)" stroke-width="2.5" fill="#131722"/>
    <!-- Film perforations or aperture accents -->
    <circle cx="20" cy="20" r="8" stroke="url(#goldGrad)" stroke-width="2.5" />
    <circle cx="20" cy="20" r="3.5" fill="#FBBF24" />
    <rect x="7" y="5" width="2.5" height="2.5" rx="0.5" fill="#FBBF24" opacity="0.8"/>
    <rect x="30.5" y="5" width="2.5" height="2.5" rx="0.5" fill="#FBBF24" opacity="0.8"/>
    <rect x="7" y="32.5" width="2.5" height="2.5" rx="0.5" fill="#FBBF24" opacity="0.8"/>
    <rect x="30.5" y="32.5" width="2.5" height="2.5" rx="0.5" fill="#FBBF24" opacity="0.8"/>
  </g>
  <!-- Wordmark -->
  <text x="60" y="38" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="800" font-size="24" fill="#FFFFFF" letter-spacing="-0.5px">MOVIE<tspan fill="url(#goldGrad)">0</tspan></text>
  <text x="145" y="25" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#FBBF24" letter-spacing="1.5px">CINÉMA</text>
</svg>